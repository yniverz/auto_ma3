# Builds the Mac release (AutoMA3.command with its own Java runtime) and publishes a GitHub Release whenever the
# "release" branch is pushed (e.g. after merging main into release). Running copies print a notice when a newer
# release exists.
#
# Version: major.minor from pom.xml + the run number of this workflow, e.g. 1.0.7.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch: {}

permissions:
  contents: write   # create releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Version
        id: version
        run: |
          base=$(sed -n 's:.*<version>\([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*</version>.*:\1:p' pom.xml | head -1)
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building AutoMA3 ${base}.${{ github.run_number }}"

      - name: Tests
        run: mvn -B -q clean verify

      - name: Build release
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: packaging/build-mac-release.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "target/dist/AutoMA3-$VERSION-mac-arm64.zip" \
            --target "$GITHUB_SHA" \
            --title "AutoMA3 $VERSION" \
            --generate-notes
